<!DOCTYPE html>
<!-- Static Thai, no JS, no brand CSS. Isolates the PDF text-layer question.
     Contains น้ำ = น + U+0E49 + U+0E33, the decomposition trap. -->
<html lang="th">
<head><meta charset="UTF-8"><title>Thai text layer</title>
<style>
@font-face { font-family: 'TH Aeonik';
  src: url('../../../../assets/fonts/th-aeonik/TH-Aeonik-Regular.otf') format('opentype');
  font-weight: 400; }
@page { size: A4; margin: 20mm }
body { font-family: 'TH Aeonik'; font-size: 14pt }
</style></head>
<body>
<p>ระบบนี้ออกแบบสำหรับน้ำตาลทรายดิบ</p>
<p>การกำจัดสีวัดได้ที่ 94.2 เปอร์เซ็นต์</p>
<p>น้ำป้อนต้องมีความขุ่นไม่เกิน 5 NTU</p>
<p>กำลังการผลิต 2569 ลูกบาศก์เมตรต่อวัน</p>
</body>
</html>

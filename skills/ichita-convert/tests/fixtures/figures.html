<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:A4;margin:18mm}body{font-family:sans-serif;font-size:11px}

</style></head><body>
<h1>Performance Report</h1>
<p>Colour removal against feed turbidity across the 2025 campaign.</p>
<h2>Figure 1 — Removal vs turbidity</h2>
<div class="chart">
<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="380" height="200" fill="#F0F4F5"/>
  <line x1="40" y1="170" x2="360" y2="170" stroke="#263338" stroke-width="1.5"/>
  <line x1="40" y1="20" x2="40" y2="170" stroke="#263338" stroke-width="1.5"/>
  <rect x="60"  y="60"  width="30" height="110" fill="#2978FF"/>
  <rect x="110" y="80"  width="30" height="90"  fill="#2978FF"/>
  <rect x="160" y="50"  width="30" height="120" fill="#2978FF"/>
  <rect x="210" y="95"  width="30" height="75"  fill="#2978FF"/>
  <rect x="260" y="40"  width="30" height="130" fill="#2978FF"/>
  <rect x="310" y="70"  width="30" height="100" fill="#2978FF"/>
</svg>
</div>
<h2>Figure 2 — Specific energy trend</h2>
<div class="chart">
<svg width="380" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="380" height="180" fill="#FFFFFF" stroke="#CFD9DB"/>
  <polyline points="40,140 100,120 160,125 220,95 280,80 340,60" fill="none" stroke="#2978FF" stroke-width="3"/>
  <circle cx="40" cy="140" r="4" fill="#171C21"/><circle cx="100" cy="120" r="4" fill="#171C21"/>
  <circle cx="160" cy="125" r="4" fill="#171C21"/><circle cx="220" cy="95" r="4" fill="#171C21"/>
  <circle cx="280" cy="80" r="4" fill="#171C21"/><circle cx="340" cy="60" r="4" fill="#171C21"/>
</svg>
</div>
<p>Both figures are vector paths, which is what an ICHITA brief actually contains.</p>
</body></html>

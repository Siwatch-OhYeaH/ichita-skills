<script>
  const one = document.getElementById('one').getBoundingClientRect().height;
  const six = document.getElementById('six').getBoundingClientRect().height;
  // Whether the FONT ACTUALLY LOADED is part of the measurement. A file:// URL
  // that does not resolve makes the browser silently lay the page out in a
  // fallback face, and its line box would be reported as if it were ours.
  const loaded = document.fonts.check('100px "TH Aeonik"');
  document.title = JSON.stringify({one: one, six: six, loaded: loaded,
                                   pitch: (six - one) / 5});
</script>
